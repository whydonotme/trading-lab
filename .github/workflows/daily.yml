name: Dzienny skan strategii

on:
  schedule:
    - cron: "0 22 * * 1-5"     # 22:00 UTC, pon-pt, po zamknieciu sesji USA
  workflow_dispatch:            # pozwala odpalic recznie z zakladki Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python run.py
      - name: Zapisz wynik do repo
        run: |
          git config user.name  "trading-lab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "skan $(date -u +%Y-%m-%d)"
          git push
